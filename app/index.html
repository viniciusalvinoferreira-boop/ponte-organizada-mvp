<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ponte Organizada: Entrar</title>
<link rel="stylesheet" href="estilo.css">
</head>
<body data-pagina="login">
<a class="pular" href="#conteudo">Pular para o conteúdo</a>
<div class="app">
<header class="topo"><div class="marca">Ponte Organizada</div></header>
<main id="conteudo">
<h1>Entrar</h1>
<div id="avisos"></div>
<form id="form-login" novalidate>
<label for="e">Email <span class="obrig">(obrigatório)</span></label>
<input id="e" type="email" autocomplete="email" placeholder="seunome@instituto.org">
<label for="s">Senha <span class="obrig">(obrigatório)</span></label>
<input id="s" type="password" autocomplete="current-password">
<button class="btn" type="submit">Entrar</button>
</form>
<p class="nota">Acesso de demonstração: qualquer email válido e senha com 4 ou mais caracteres. Os dados ficam só neste navegador.</p>
</main>
</div>
<script src="../src/validacao.js"></script>
<script src="../src/fila.js"></script>
<script src="../src/cadastro.js"></script>
<script src="app.js"></script>
</body>
</html>
